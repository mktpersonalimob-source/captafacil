<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaptaFácil - Gestão de Captação Imobiliária</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='4' fill='%23EA580C'/%3E%3Cpath d='M12 6l6 5v7H6v-7l6-5z' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Utilitários de Geração de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Estilos Unificados -->
    <link rel="stylesheet" href="css/styles.css">

    <script>
        // Redirecionamento automático se a URL contiver parâmetros de token de assinatura
        if (window.location.search.includes('token=') && !window.location.hash.includes('assinatura')) {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (token) {
                window.location.hash = `#/assinatura?token=${token}`;
            }
        }
    </script>
</head>
<body>
    <!-- Container Raiz onde as views são injetadas dinamicamente -->
    <div id="app">
        <div class="fixed inset-0 bg-white bg-opacity-90 z-[9999] flex items-center justify-center flex-col">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-orange-500 mb-4"></div>
            <p class="text-lg text-gray-700 font-semibold">Iniciando CaptaFácil...</p>
        </div>
    </div>

    <!-- Módulos da Aplicação -->
    <script src="js/config/firebase.js"></script>
    <script src="js/components/loading.js"></script>
    <script src="js/components/modalAlert.js"></script>
    <script src="js/services/pdfService.js"></script>
    <script src="js/services/authService.js"></script>
    <script src="js/services/captacaoService.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/views/loginView.js"></script>
    <script src="js/views/setupView.js"></script>
    <script src="js/views/homeView.js"></script>
    <script src="js/views/historyView.js"></script>
    <script src="js/views/formView.js"></script>
    <script src="js/views/adminView.js"></script>
    <script src="js/views/assinaturaView.js"></script>
    <script src="js/router/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
