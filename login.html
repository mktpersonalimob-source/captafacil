                </div>
                <div>
                    <label for="password" class="text-sm font-medium text-gray-700">Senha</label>
                    <input id="password" name="password" type="password" required
                           class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-lg focus:ring-orange-500 focus:border-orange-500">
                </div>
                <div>
                    <button type="submit" id="btn-login"
                            class="w-full px-4 py-2 font-semibold text-white bg-orange-600 rounded-lg hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // ATENÇÃO: Substitua com a configuração do seu projeto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAvqL_ESrGNMsMxlKt4Iwen_fBRZ4e_y58",
            authDomain: "captafacil-6cf54.firebaseapp.com",
            projectId: "captafacil-6cf54",
            storageBucket: "captafacil-6cf54.firebasestorage.app",
            messagingSenderId: "398747051095",
            appId: "1:398747051095:web:68e8bf8c01988c045eef12"
        };
        // measurementId: "G-HTGSNFZH3G" // Não é necessário para o funcionamento básico

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('login-error');
        const loginButton = document.getElementById('btn-login');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loginError.textContent = '';
            loginButton.disabled = true;
            loginButton.textContent = 'Aguarde...';

            const email = emailInput.value;
            const password = passwordInput.value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Login bem-sucedido, registra logs e redireciona
                    const user = userCredential.user;
                    const userRef = db.collection('users').doc(user.uid);

                    // Primeiro, garante que o documento do usuário existe e registra o acesso
                    userRef.set({
                        email: user.email,
                        last_seen: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).then(() => {
                        // Agora, lê o documento atualizado para verificar o status do setup
                        userRef.get().then(doc => {
                            // Registra o login no log de auditoria
                            db.collection('audit_logs').add({
                                action: 'LOGIN',
                                userEmail: user.email,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            if (doc.exists && doc.data().setup_completed) {
                                window.location.href = 'home.html'; // Setup completo
                            } else {
                                window.location.href = 'setup.html'; // Setup incompleto
                            }
                        });
                    });
                })
                .catch((error) => {
                    // Trata erros de login
                    loginError.textContent = 'Email ou senha inválidos. Tente novamente.';
                    loginButton.disabled = false;
                    loginButton.textContent = 'Entrar';
                });
        });
    </script>
